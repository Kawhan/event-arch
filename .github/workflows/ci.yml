# Builds the solution and runs every test (unit + Testcontainers integration)
# on each push to main and on every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that became outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # Ubuntu runners ship with Docker, which the Testcontainers tests need.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        # Warnings fail the build, keeping the "0 warnings" state of the code base.
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --logger "trx;LogFilePrefix=results"
          --results-directory TestResults

      - name: Upload test results
        # Keeps the results downloadable even (especially) when tests fail.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
