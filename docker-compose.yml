# Local environment: infrastructure plus the application. Credentials are for local use only.
#   Everything:              docker compose up -d --build
#   Only infra (debug in IDE): docker compose up -d postgres rabbitmq seq
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: eventarch
      POSTGRES_USER: eventarch
      POSTGRES_PASSWORD: eventarch
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventarch -d eventarch"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"   # AMQP (used by the API and the worker)
      - "15672:15672" # Management UI: http://localhost:15672 (guest / guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      # No login locally; never use this setting outside a developer machine.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80" # UI and log ingestion: http://localhost:5341
    volumes:
      - seq-data:/data

  # ---- Application ----
  # Inside the compose network services reach each other by name, so the
  # appsettings "localhost" values are overridden here with environment variables
  # ("__" maps to ":" in .NET configuration keys).

  api:
    build:
      context: .
      dockerfile: src/EventArch.Api/Dockerfile
    environment:
      # Development applies migrations on startup and exposes the OpenAPI document.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=eventarch;Username=eventarch;Password=eventarch"
      ConnectionStrings__RabbitMq: "amqp://guest:guest@rabbitmq:5672"
      Serilog__WriteTo__1__Args__serverUrl: "http://seq"
    ports:
      - "5190:8080" # Same port as the "http" launch profile, so EventArch.Api.http works unchanged
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started

  statement-worker:
    build:
      context: .
      dockerfile: src/EventArch.Statement.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=eventarch;Username=eventarch;Password=eventarch"
      ConnectionStrings__RabbitMq: "amqp://guest:guest@rabbitmq:5672"
      Serilog__WriteTo__1__Args__serverUrl: "http://seq"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started

volumes:
  postgres-data:
  seq-data:
